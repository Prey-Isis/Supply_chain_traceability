# ============================================================
# RabbitMQ 配置文件（新版 RabbitMQ 使用）
# ============================================================
# 【为什么用配置文件而不是环境变量？】
#   新版 RabbitMQ（3.9+）弃用了 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 环境变量，
#   设置该变量会导致启动失败（deprecated environment variables detected）。
#   内存水位等高级配置必须通过配置文件设置（见 rabbitmq.com/configure.html）。
#
# 【本文件解决的问题】
#   2G 小内存服务器上，RabbitMQ 默认按"物理内存 40%"算内存水位（=800M），
#   系统空闲内存跌破 800M 就触发告警拒接连接（system_memory_high_watermark）。
#   这里用相对值 0.5（=1G 阈值）放宽，减少误报。
# ============================================================

# 内存水位：相对值 0.5 = 物理内存的 50%（2G 机器 = 1G 阈值）
# 默认 0.4 = 800M，系统稍紧张就告警；0.5 更宽松，适配小内存服务器
vm_memory_high_watermark.relative = 0.5
