# ============================================================================
# RabbitMQ 的 K8s 部署清单（本机 Docker Desktop K8s）
# ----------------------------------------------------------------------------
# 【部署顺序】secret.yaml → mysql.yaml → 本文件 → 等 Running → app.yaml
#
# 【资源构成】ConfigMap（内存水位配置）+ PVC + Deployment + Service
#   - 内存水位用配置文件设置（新版 RabbitMQ 弃用了对应环境变量，设了会启动失败）
#   - 5672 = AMQP 协议端口（Go 后端连这个）；15672 = 管理界面（要看的话用
#     kubectl port-forward svc/rabbitmq 15672:15672，浏览器开 localhost:15672）
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-conf
  namespace: default
data:
  rabbitmq.conf: |
    # 内存水位：相对值 0.5 = 物理内存的 50%（默认 0.4 偏紧，容易误告警拒接连接）
    vm_memory_high_watermark.relative = 0.5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: default
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate           # 同 mysql：PVC ReadWriteOnce 不允许新旧 Pod 并存
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: docker.m.daocloud.io/library/rabbitmq:3-management
        ports:
          - containerPort: 5672
          - containerPort: 15672
        env:
          - name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: supply-chain-secret
                key: RABBITMQ_USER
          - name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: supply-chain-secret
                key: RABBITMQ_PASSWORD
          - name: TZ
            value: Asia/Shanghai
        volumeMounts:
          - name: data
            mountPath: /var/lib/rabbitmq
          - name: conf
            mountPath: /etc/rabbitmq/rabbitmq.conf
            subPath: rabbitmq.conf   # 只覆盖这一个文件，不动镜像里同目录的其他文件
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 768Mi
        # RabbitMQ（Erlang）启动要 30-60 秒，startupProbe 给足 150 秒宽限
        # ⚠️ timeoutSeconds 必须显式给 5 秒：K8s 默认只有 1 秒，而
        #    rabbitmq-diagnostics 每次要跑 1 秒以上，默认值会"探针永远超时"
        #    → 连续 3 次失败 → K8s 反复杀容器（血泪教训：启动正常也会被误杀）
        startupProbe:
          exec:
            command: ["/bin/sh", "-c", "rabbitmq-diagnostics -q ping"]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "rabbitmq-diagnostics -q ping"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: conf
          configMap:
            name: rabbitmq-conf
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq       # app 容器里 MQ_HOST=rabbitmq 连的就是这个名字
  namespace: default
spec:
  type: ClusterIP      # 不暴露到宿主机；管理界面用 kubectl port-forward 访问
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
