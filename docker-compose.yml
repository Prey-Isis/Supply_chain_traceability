# ============================================================
# 供应链溯源系统 - Docker Compose 编排文件
# 部署命令：docker-compose up -d
# 本地开发：docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: supply-chain-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}
      MYSQL_DATABASE: supply_chain
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动建表 + 导入种子数据
      - ./mysql_sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - supply-chain-net

  # 应用服务（Go 后端 + Nginx 前端）
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: supply-chain-app
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # 通过环境变量覆盖 config.yaml 中的数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}
      - DB_NAME=supply_chain
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:-your-production-secret-key}
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - supply-chain-net

volumes:
  mysql_data:
    driver: local

networks:
  supply-chain-net:
    driver: bridge
