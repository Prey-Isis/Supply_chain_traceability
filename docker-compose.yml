# ============================================================
# 供应链溯源系统 - Docker Compose 编排文件
# 部署命令：docker-compose up -d
# 本地开发：docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

services:
  # MySQL 数据库
  mysql:
    # ★ 国内镜像源（服务器直接拉 docker.io 会失败）
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: supply-chain-mysql
    restart: always
    # ★ 内存上限：MySQL 默认会吃到几百 MB，2G 小服务器必须限制
    #   384M 足够单机小项目（降低以给系统腾内存，避免触发 RabbitMQ 水位告警）
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}
      MYSQL_DATABASE: supply_chain
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      # 仅本机访问 MySQL，不暴露到外网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动建表 + 导入种子数据
      - ./mysql_sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      # 必须用 127.0.0.1 强制走 TCP：首次初始化期间 MySQL 只有 socket（3306 未监听），
      # 用 localhost 会在初始化未完成时误报 healthy，导致 app 抢跑连接被拒
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - supply-chain-net

  # RabbitMQ 消息队列
  rabbitmq:
    # ★ 国内镜像源
    image: docker.m.daocloud.io/library/rabbitmq:3-management
    container_name: supply-chain-rabbitmq
    restart: always
    # ★ 内存上限：RabbitMQ（Erlang VM）很能吃，2G 小服务器必须限制
    mem_limit: 768m
    environment:
      # 默认账号密码（生产环境通过 .env 覆盖）
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-supply_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-SupplyMQ@2024}
      TZ: Asia/Shanghai
    # ★ 内存水位通过配置文件设置（新版 RabbitMQ 弃用了对应环境变量！
    #   设 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 会直接启动失败）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # 配置文件：调低内存水位阈值，避免 2G 小服务器误触发告警拒接连接
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      # AMQP 协议端口：Go 服务连接用
      # 宿主机映射方便本地调试（go run 直连 MQ）
      # ⚠️ 阿里云安全组不要放行 5672 公网访问！容器间走内部网络即可
      - "127.0.0.1:5672:5672"
      # 管理界面：http://localhost:15672（只绑定本机回环，安全）
      # SSH 隧道访问：ssh -L 15672:localhost:15672 root@服务器IP
      - "127.0.0.1:15672:15672"
    healthcheck:
      # 必须用 check_port_connectivity（探测 5672 端口真实可连）：
      # ping 在 Erlang 节点起来但 AMQP 端口未监听时就会误报 healthy，导致 app 抢跑被拒
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - supply-chain-net

  # 应用服务（Go 后端 + Nginx 前端）
  app:
    image: supply-chain-app:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: supply-chain-app
    restart: always
    # ★ 内存上限：Go 后端 + Nginx 共用容器，256M 太紧会导致启动时 OOM 被杀
    #   （Go 连接池初始化 + RabbitMQ 客户端 + Nginx，512M 更稳妥）
    mem_limit: 512m
    ports:
      # 绑定所有网络接口，允许外部 IP 访问
      - "${APP_PORT:-80}:80"
    environment:
      # 通过环境变量覆盖 config.yaml 中的数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-SupplyChain@2024}
      - DB_NAME=supply_chain
      # RabbitMQ 连接配置（容器网络内用服务名 rabbitmq）
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=${RABBITMQ_USER:-supply_mq}
      - MQ_PASSWORD=${RABBITMQ_PASSWORD:-SupplyMQ@2024}
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:-your-production-secret-key}
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - supply-chain-net

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  supply-chain-net:
    driver: bridge
