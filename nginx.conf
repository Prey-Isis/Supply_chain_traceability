# ============================================================
# 供应链溯源系统 - Nginx 配置
# ★ 本版本支持路径前缀 /supply_chain，用于一个服务器部署多个项目
# ============================================================
# 【路径前缀的工作原理】
#   浏览器访问:  http://IP/supply_chain/            → 前端页面
#   浏览器请求:  http://IP/supply_chain/api/v1/xxx  → Nginx 剥离前缀 → 后端 /api/v1/xxx
#
# 【为什么能剥离前缀？】
#   location /supply_chain/api/  +  proxy_pass http://localhost:8080/api/
#   Nginx 规则：匹配 location 后，把 URI 中 location 的部分"替换"为 proxy_pass 的路径
#   即: /supply_chain/api/v1/login → 去掉 /supply_chain/api/ → 拼上 /api/ → /api/v1/login
# ============================================================

server {
    listen 80;
    # _ 表示接受所有域名/IP 的请求，支持外部网络访问
    server_name _;

    # 上传文件大小限制
    client_max_body_size 20M;

    # ============================================================
    # 根路径：重定向到带前缀的地址
    #   访问 http://IP/  →  自动跳转 http://IP/supply_chain/
    # ============================================================
    location = / {
        return 301 /supply_chain/;
    }

    # ============================================================
    # 前端静态文件（带 /supply_chain/ 前缀）
    #   root /usr/share/nginx/html → 实际文件在 /usr/share/nginx/html/supply_chain/
    # ============================================================
    location /supply_chain/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /supply_chain/index.html;
        index index.html;
    }

    # ============================================================
    # API 代理到 Go 后端（★ 剥离 /supply_chain 前缀）
    #   关键点：proxy_pass 末尾的 /api/ 是对应 location 前缀的"替换路径"
    # ============================================================
    location /supply_chain/api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================================
    # 静态资源缓存（js/css/图片等带 hash 的文件，可永久缓存）
    # ============================================================
    location ~* /supply_chain/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
